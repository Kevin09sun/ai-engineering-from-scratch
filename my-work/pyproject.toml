# Exercise 3 (Phase 0 / Lesson 6): a project needing both PyTorch and the Anthropic SDK.
# Base deps install always; heavy/optional groups install on demand via extras.
[project]
name = "torch-plus-anthropic-demo"
version = "0.1.0"
description = "Example project combining local PyTorch inference with the Anthropic SDK"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "anthropic>=0.39",
]

[project.optional-dependencies]
# Heavy ML stack kept optional so CI / API-only deploys can skip it.
torch = [
    "torch>=2.3",
    "torchvision>=0.18",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Install recipes:
#   uv pip install -e .            -> base + anthropic only (no torch)
#   uv pip install -e ".[torch]"  -> add PyTorch
#   uv pip install -e ".[torch,dev]" -> everything

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
